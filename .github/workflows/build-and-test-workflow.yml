name: Workflow for Building and Testing

on:
  workflow_call:
    inputs:
      sha:
        required: true
        type: string
      ENVIRONMENT:
        required: true
        type: string
    secrets:
      WALLET_ADDRESS:
        required: false
      WALLET_PRIVATE_KEY:
        required: false
      RPC_PROVIDER_URL:
        required: false

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    environment: ${{ inputs.ENVIRONMENT }}
    env:
      WALLET_ADDRESS: ${{ secrets.WALLET_ADDRESS }}
      WALLET_PRIVATE_KEY: ${{ secrets.WALLET_PRIVATE_KEY }}
      RPC_PROVIDER_URL: ${{ secrets.RPC_PROVIDER_URL }}
    steps:
      - name: Checkout PR head (fork-controlled)
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha }}
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install (executes setup.py from checked-out tree)
        run: pip install -e ".[dev]"
      - name: Run unit tests
        run: pytest tests/unit -v
